name: Publish Framework SDK to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0)'
        required: true

concurrency:
  group: publish-framework
  cancel-in-progress: false

env:
  CI: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: maven-central-release
    permissions:
      contents: write
    env:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
      JRELEASER_NEXUS2_SNAPSHOT_DEPLOY_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
      JRELEASER_NEXUS2_SNAPSHOT_DEPLOY_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ vars.GPG_PUBLIC_KEY }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Verify version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH, got '$INPUT_VERSION'"; exit 1
          fi
          ACTUAL=$(./gradlew :properties -q | awk -F': ' '/^version: /{print $2; exit}')
          if [ -z "$ACTUAL" ]; then echo "::error::could not read project version"; exit 1; fi
          if [ "$ACTUAL" != "$INPUT_VERSION" ]; then
            echo "::error::Version mismatch: build.gradle has '$ACTUAL', input was '$INPUT_VERSION'"; exit 1
          fi

      - name: Download test data
        run: make test-data

      - name: Test
        run: ./gradlew check

      - name: Verify JReleaser
        run: ./gradlew jreleaserConfig --stacktrace

      - name: Stage artifacts
        # :clean clears root build/ including build/staging-deploy, ensuring no stale artifacts are deployed
        run: ./gradlew :clean :publish -Prelease

      - name: Deploy to Maven Central
        run: ./gradlew jreleaserDeploy

      - name: Tag and release
        # Tag and create GitHub release after successful deploy — avoids orphaned tags on failed publishes.
        # Changelog covers commits touching the root project since the last eppo-sdk-framework-v* tag,
        # excluding the eppo-sdk-common subproject directory.
        # LAST_TAG is resolved before creating the new tag to avoid picking it as its own predecessor.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'eppo-sdk-framework-v*' HEAD 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then RANGE="${LAST_TAG}..HEAD"; else RANGE="HEAD"; fi
          NOTES=$(git log "$RANGE" --oneline -- . ':(exclude)eppo-sdk-common/' | sed 's/^/- /')

          TAG="eppo-sdk-framework-v${INPUT_VERSION}"
          git tag -a "$TAG" -m "Release eppo-sdk-framework v${INPUT_VERSION}"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "eppo-sdk-framework v${INPUT_VERSION}" \
            --notes "${NOTES:-No changes recorded}"
