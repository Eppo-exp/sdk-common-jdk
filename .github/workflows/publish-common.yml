name: Publish Common SDK to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 4.0.0)'
        required: true

concurrency:
  group: publish-common
  cancel-in-progress: false

env:
  CI: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: maven-central-release
    permissions:
      contents: write
    env:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
      JRELEASER_NEXUS2_SNAPSHOT_DEPLOY_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
      JRELEASER_NEXUS2_SNAPSHOT_DEPLOY_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ vars.GPG_PUBLIC_KEY }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Verify version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH, got '$INPUT_VERSION'"; exit 1
          fi
          ACTUAL=$(./gradlew :eppo-sdk-common:properties -q | awk -F': ' '/^version: /{print $2; exit}')
          if [ -z "$ACTUAL" ]; then echo "::error::could not read subproject version"; exit 1; fi
          if [ "$ACTUAL" != "$INPUT_VERSION" ]; then
            echo "::error::Version mismatch: eppo-sdk-common/build.gradle has '$ACTUAL', input was '$INPUT_VERSION'"; exit 1
          fi
          ROOT=$(./gradlew :properties -q | awk -F': ' '/^version: /{print $2; exit}')
          if [ -z "$ROOT" ]; then echo "::error::could not read root version"; exit 1; fi
          case "$ROOT" in
            *-SNAPSHOT)
              echo "::error::root version is $ROOT. Releasing sdk-common-jvm now would embed a SNAPSHOT framework dependency in the release POM and route the deploy to the snapshot repository. Release eppo-sdk-framework first."
              exit 1 ;;
          esac
          if ! curl -fsI "https://repo1.maven.org/maven2/cloud/eppo/eppo-sdk-framework/${ROOT}/eppo-sdk-framework-${ROOT}.pom" > /dev/null; then
            echo "::error::eppo-sdk-framework:${ROOT} not found on Maven Central. Confirm the framework publish job succeeded and the version is indexed before releasing sdk-common-jvm."
            exit 1
          fi

      - name: Download test data
        run: make test-data

      - name: Test
        run: ./gradlew check

      - name: Verify JReleaser
        run: ./gradlew jreleaserConfig --stacktrace

      - name: Stage artifacts
        # :eppo-sdk-common:clean only cleans the subproject; explicitly remove root staging-deploy
        # to prevent stale artifacts from prior runs being re-deployed by jreleaserDeploy.
        # Note: checkVersion in root build.gradle gates :publish but not :eppo-sdk-common:publish;
        # the version-input verification step above covers the same guard for this workflow.
        run: |
          rm -rf build/staging-deploy
          ./gradlew :eppo-sdk-common:clean :eppo-sdk-common:publish -Prelease

      - name: Deploy to Maven Central
        # jreleaserDeploy runs from the root project (version = framework version, e.g. 0.1.0).
        # The root version controls RELEASE vs SNAPSHOT mode only (active = 'RELEASE' when non-SNAPSHOT).
        # Artifact coordinates come from the staged files in build/staging-deploy, which carry the
        # correct sdk-common-jvm version (e.g. 4.0.0) — JReleaser does not re-key them off project.version.
        run: ./gradlew jreleaserDeploy

      - name: Tag and release
        # Tag and create GitHub release after successful deploy — avoids orphaned tags on failed publishes.
        # Changelog covers commits touching eppo-sdk-common/ since the last sdk-common-jvm-v* tag.
        # LAST_TAG is resolved before creating the new tag to avoid picking it as its own predecessor.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'sdk-common-jvm-v*' HEAD 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then RANGE="${LAST_TAG}..HEAD"; else RANGE="HEAD"; fi
          NOTES=$(git log "$RANGE" --oneline -- eppo-sdk-common/ | sed 's/^/- /')

          TAG="sdk-common-jvm-v${INPUT_VERSION}"
          git tag -a "$TAG" -m "Release sdk-common-jvm v${INPUT_VERSION}"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "sdk-common-jvm v${INPUT_VERSION}" \
            --notes "${NOTES:-No changes recorded}"
